name: Release

# Push a tag like v0.1.0 (stable) or v0.2.0-preview.1 (preview, for testers).
# Builds Symphony and the launcher for every OS, writes SHA256SUMS and
# publishes a GitHub Release, which is what the launcher reads (ENGINEERING E13).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux audio headers (sound playback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }} -p symphony-app -p symphony-launcher
      # One Mac launcher for both chips (browsers can't tell an Apple-chip
      # Mac from an Intel one, so testers shouldn't have to choose). Each
      # half still downloads the Symphony build for its own chip.
      - name: Universal Mac launcher
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin -p symphony-launcher
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/symphony-launcher \
            target/aarch64-apple-darwin/release/symphony-launcher \
            target/x86_64-apple-darwin/release/symphony-launcher
          lipo -archs target/universal-apple-darwin/release/symphony-launcher
      - name: Package
        shell: bash
        run: scripts/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          # Artist-facing notes when written (docs/release-notes/<version>.md),
          # otherwise GitHub's list of changes.
          NOTES="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES" ]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "Symphony ${GITHUB_REF_NAME#v}" \
            "${NOTE_ARGS[@]}"
