[package]
name = "symphony-launcher"
description = "Installs, updates and launches Symphony from GitHub Releases (docs/ENGINEERING.md E13)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "symphony-launcher"
path = "src/main.rs"

[dependencies]
dirs = "7"
eframe = "0.37"
flate2 = "1"
# The logo (window icon and title) and design screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphony-ui = { path = "../symphony-ui", default-features = false }
tar = "0.4"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
