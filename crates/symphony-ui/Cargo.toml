[package]
name = "symphony-ui"
description = "Symphony's look: design tokens, egui theme, fonts and icon set (docs/DESIGN.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_dock = { version = "0.22", optional = true }

[features]
default = ["dock"]
dock = ["dep:egui_dock"]
