[package]
name = "symphony-app"
description = "Symphony desktop app: dockable views over the Symphony scene model."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "symphony"
path = "src/main.rs"

[dependencies]
dirs = "7"
eframe = { version = "0.37", features = ["persistence"] }
egui_dock = { version = "0.22", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
symphony-core = { version = "0.0.1", path = "../symphony-core" }
symphony-io = { version = "0.0.1", path = "../symphony-io" }
symphony-pen = { version = "0.0.1", path = "../symphony-pen" }
symphony-render = { version = "0.0.1", path = "../symphony-render" }
symphony-ui = { version = "0.0.1", path = "../symphony-ui" }
symphony-vector = { version = "0.0.1", path = "../symphony-vector" }
