[package]
name = "symphony-io"
description = "Saving and opening Symphony projects: versioned, atomic, with backups and crash recovery (ENGINEERING E7)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
symphony-core = { path = "../symphony-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr"] }
exr = { version = "1.74.3", default-features = false }
